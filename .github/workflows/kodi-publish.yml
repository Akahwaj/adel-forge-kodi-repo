name: Kodi Auto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-kodi-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required Kodi files
        run: |
          test -f repository.sentinel.build-1.0.0.zip
          test -f plugin.sentinel.wizard-1.0.0.zip
          test -f addons.xml

      - name: Create short ZIP aliases
        run: |
          cp repository.sentinel.build-1.0.0.zip repo.zip
          cp plugin.sentinel.wizard-1.0.0.zip wizard.zip

      - name: Generate addons.xml.md5
        run: |
          md5sum addons.xml | awk '{ print $1 }' > addons.xml.md5

      - name: Commit published Kodi artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo.zip wizard.zip addons.xml.md5

          if git diff --cached --quiet; then
            echo "No Kodi artifact changes to commit."
          else
            git commit -m "Auto-publish Kodi repository artifacts"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Print Kodi URLs
        run: |
          echo "Kodi Source: https://akahwaj.github.io/kodi/"
          echo "Repository ZIP: https://akahwaj.github.io/kodi/repo.zip"
          echo "Wizard ZIP: https://akahwaj.github.io/kodi/wizard.zip"
          echo "Manifest: https://akahwaj.github.io/kodi/addons.xml"
