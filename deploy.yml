name: SENTINEL BUILD - Auto Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'addons.xml'
      - 'addons.xml.md5'
      - 'README.md'
      - 'plugin.sentinel.wizard/**'
      - 'repository.sentinel.build/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check Required Files
      run: |
        echo "📋 Checking SENTINEL BUILD files..."
        files=("addons.xml" "addons.xml.md5" "README.md" "LICENSE" "ADDON_MANIFEST.md")
        
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            size=$(du -h "$file" | cut -f1)
            echo "✅ $file ($size)"
          else
            echo "❌ $file (MISSING)"
            exit 1
          fi
        done
        
        echo ""
        echo "Directories:"
        [ -d "repository.sentinel.build" ] && echo "✅ repository.sentinel.build/" || (echo "❌ repository.sentinel.build/"; exit 1)
        [ -d "plugin.sentinel.wizard" ] && echo "✅ plugin.sentinel.wizard/" || (echo "❌ plugin.sentinel.wizard/"; exit 1)

    - name: Validate addons.xml
      run: |
        echo "🔍 Validating addons.xml..."
        
        # Check if valid XML
        if python3 -c "import xml.etree.ElementTree as ET; ET.parse('addons.xml')" 2>/dev/null; then
          echo "✅ Valid XML format"
        else
          echo "❌ Invalid XML format"
          exit 1
        fi
        
        # Count add-ons
        addon_count=$(grep -c "addon id=" addons.xml)
        echo "📦 Found $addon_count items in manifest"
        
        if [ $addon_count -lt 15 ]; then
          echo "⚠️  Warning: Expected 15+ items, found $addon_count"
        fi

    - name: Verify MD5 Checksum
      run: |
        echo "🔐 Verifying MD5 checksum..."
        
        # Extract expected hash from .md5 file
        expected_hash=$(cut -d' ' -f1 addons.xml.md5)
        
        # Calculate actual hash
        actual_hash=$(md5sum addons.xml | cut -d' ' -f1)
        
        echo "Expected: $expected_hash"
        echo "Actual:   $actual_hash"
        
        if [ "$expected_hash" = "$actual_hash" ]; then
          echo "✅ MD5 checksum matches"
        else
          echo "❌ MD5 checksum mismatch!"
          exit 1
        fi

    - name: Check Repository Structure
      run: |
        echo "📂 Checking repository structure..."
        
        if [ -f "repository.sentinel.build/addon.xml" ]; then
          echo "✅ repository.sentinel.build/addon.xml"
        else
          echo "❌ repository.sentinel.build/addon.xml (MISSING)"
          exit 1
        fi
        
        if [ -f "plugin.sentinel.wizard/addon.xml" ]; then
          echo "✅ plugin.sentinel.wizard/addon.xml"
        else
          echo "❌ plugin.sentinel.wizard/addon.xml (MISSING)"
          exit 1
        fi

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Release Artifacts
      run: |
        echo "📦 Creating release artifacts..."
        
        # Create zips if they don't exist
        if [ ! -f "repository.sentinel.build-1.0.0.zip" ]; then
          zip -r repository.sentinel.build-1.0.0.zip repository.sentinel.build/ -x 'repository.sentinel.build/*.zip'
          echo "✅ Created repository.sentinel.build-1.0.0.zip"
        else
          echo "✅ repository.sentinel.build-1.0.0.zip exists"
        fi
        cp repository.sentinel.build-1.0.0.zip repository.sentinel.build/repository.sentinel.build-1.0.0.zip
        
        if [ ! -f "plugin.sentinel.wizard-1.0.0.zip" ]; then
          zip -r plugin.sentinel.wizard-1.0.0.zip plugin.sentinel.wizard/ -x 'plugin.sentinel.wizard/*.zip'
          echo "✅ Created plugin.sentinel.wizard-1.0.0.zip"
        else
          echo "✅ plugin.sentinel.wizard-1.0.0.zip exists"
        fi
        cp plugin.sentinel.wizard-1.0.0.zip plugin.sentinel.wizard/plugin.sentinel.wizard-1.0.0.zip

    - name: Generate Build Report
      run: |
        echo "📊 Build Report" > BUILD_REPORT.txt
        echo "================" >> BUILD_REPORT.txt
        echo "" >> BUILD_REPORT.txt
        echo "Build Date: $(date)" >> BUILD_REPORT.txt
        echo "GitHub Ref: $GITHUB_REF" >> BUILD_REPORT.txt
        echo "GitHub SHA: ${GITHUB_SHA:0:7}" >> BUILD_REPORT.txt
        echo "" >> BUILD_REPORT.txt
        echo "Files:" >> BUILD_REPORT.txt
        ls -lh *.xml *.md5 *.md *.txt 2>/dev/null >> BUILD_REPORT.txt
        echo "" >> BUILD_REPORT.txt
        echo "Directories:" >> BUILD_REPORT.txt
        du -sh */ >> BUILD_REPORT.txt
        echo "" >> BUILD_REPORT.txt
        echo "Add-ons in Manifest:" >> BUILD_REPORT.txt
        grep 'addon id=' addons.xml | sed 's/.*addon id="\([^"]*\).*/  - \1/' >> BUILD_REPORT.txt
        
        cat BUILD_REPORT.txt

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create GitHub Pages Index
      run: |
        echo "🌐 Creating GitHub Pages index..."
        
        cat > index.html << 'HTMLEOF'
